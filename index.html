<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="2 Loons Pickup is getting ready to haul furniture and junk in the St. Paul area. Call or email us about your pickup.">
<title>2 Loons Pickup | Furniture &amp; Junk Removal</title>
<link rel="icon" href="loon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--ink:#191f1c;--paper:#fffaf0;--sand:#f0e7d5;--red:#a53830;--line:#c7bba4}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#eae1d0;color:var(--ink);font:1rem/1.5 system-ui,sans-serif}
main{width:min(calc(100% - 3rem),70rem);margin:2rem 0;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--red);display:grid;grid-template-columns:42% 1fr;box-shadow:0 14px 46px #38260f19}
.art{display:grid;place-items:center;background:var(--sand);padding:2rem}
.art img{display:block;width:min(100%,23rem);height:auto}
.content{padding:clamp(1.75rem,5vw,4.5rem)}
.area{margin:0 0 .85rem;color:var(--red);font-weight:750;font-size:.875rem}
h1{font-family:"Arial Black",system-ui,sans-serif;font-size:clamp(2.8rem,6.4vw,6rem);letter-spacing:-.075em;font-weight:950;line-height:.88;margin:0}
.service{margin:1rem 0 0;font-size:clamp(1.05rem,2.25vw,1.38rem);font-weight:700}
.intro{max-width:34ch;margin:1.2rem 0 1.55rem}
.contacts{display:grid;gap:.65rem;border-top:1px solid var(--line);padding-top:1.1rem;width:fit-content;max-width:100%}
.contacts a{font-weight:725;min-height:44px;display:flex;align-items:center;padding:.5rem .85rem;border:1px solid var(--ink);border-radius:4px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.contacts a:first-child{background:var(--ink);color:var(--paper)}
.contacts a:hover{text-decoration:underline;text-underline-offset:4px}
.contacts a:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.contacts p{margin:-.43rem 0 .1rem;font-size:.875rem}
@media(max-width:680px){
main{width:min(calc(100% - 2rem),28rem);margin:1rem 0;grid-template-columns:1fr}
.art{padding:.5rem .75rem}.art img{width:9rem}
.content{padding:1.15rem}
h1{font-size:clamp(2.55rem,10vw,3.4rem)}
.area{margin-bottom:.45rem}.service{margin-top:.65rem}.intro{margin:.65rem 0 .9rem}
.contacts{padding-top:.75rem}
}
</style>
</head>
<body>
<main>
  <div class="art"><img src="loon.svg" width="320" height="288" alt="Two haulers carry a couch inside the shape of a loon’s head"></div>
  <div class="content">
    <p class="area">Coming soon in the St. Paul area</p>
    <h1>2 LOONS<br>PICKUP</h1>
    <p class="service">Furniture &amp; junk removal</p>
    <p class="intro">Have an old couch, garage clutter, or a small cleanout? Tell us what needs to go, your zip code, and when you’d like it picked up.</p>
    <div class="contacts">
      <a href="tel:+16514324870">Call 651-432-4870</a>
      <p>Enter 6077 when prompted.</p>
      <a href="mailto:helpme@2loonspickup.com">helpme@2loonspickup.com</a>
    </div>
  </div>
</main>
</body>
</html>
